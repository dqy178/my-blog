name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 单元测试
        run: mvn -B test

      - name: 打包
        run: mvn -B package -DskipTests

      - name: 校验安装脚本可正常建库
        # 用 MySQL 8 跑一遍初始化脚本，确认脚本与实体定义保持一致
        run: |
          docker run -d --name ci-mysql \
            -e MYSQL_ROOT_PASSWORD=123456 \
            -e MYSQL_DATABASE=blog_db \
            -v "$PWD/src/main/resources/db/blog_db.sql:/docker-entrypoint-initdb.d/blog_db.sql:ro" \
            mysql:8.0
          for i in $(seq 1 60); do
            if docker logs ci-mysql 2>&1 | grep -q "init process done"; then break; fi
            if docker logs ci-mysql 2>&1 | grep -q "\[ERROR\]"; then
              docker logs ci-mysql; exit 1
            fi
            sleep 3
          done
          docker logs ci-mysql 2>&1 | grep -q "init process done" || { docker logs ci-mysql; exit 1; }
          # article 表必须有 content 列、comment 表必须有 content 列
          docker exec ci-mysql mysql -uroot -p123456 -N -e \
            "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='blog_db' AND TABLE_NAME='article' AND COLUMN_NAME='content';" \
            | grep -qx 1
          docker exec ci-mysql mysql -uroot -p123456 -N -e \
            "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='blog_db' AND TABLE_NAME='comment' AND COLUMN_NAME='content';" \
            | grep -qx 1
          docker rm -f ci-mysql

  frontend:
    name: 前端类型检查与 lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blog-frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: ESLint 检查
        run: npm run lint:check

      - name: 构建
        run: npm run build

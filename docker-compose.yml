name: blog-system

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: blog_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      # 宿主机映射到 3307：宿主机已装有 MySQL 5.7 服务占用 3306。
      # 容器内端口不变(3306)，后端通过服务名 mysql:3306 连接，不受影响。
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./blog-backend/src/main/resources/db/blog_db.sql:/docker-entrypoint-initdb.d/blog_db.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./blog-backend
      dockerfile: Dockerfile
    container_name: blog-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blog_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # JWT 签名密钥：必须显式提供，否则 prod profile 启动即失败。
      # 生成方式: openssl rand -base64 48   (或 python -c "import secrets;print(secrets.token_urlsafe(48))")
      # 放到根目录 .env 文件里 (JWT_SECRET=xxx)，.env 已被 .gitignore 忽略
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET，生成方式见 .env.example}

      FILE_UPLOAD_PATH: /app/uploads/
      FILE_UPLOAD_DOMAIN: http://localhost:8080/api

      # 站内知识问答（RAG）
      #
      # provider=mock   本地模拟，不调外部大模型（默认，无需 Key）
      # provider=openai OpenAI 兼容协议：DeepSeek / 通义兼容模式 / Ollama 等
      #
      # 启用真实模型：在根目录 .env 里设 RAG_PROVIDER=openai 与 RAG_API_KEY=你的key，
      # 然后执行 docker compose up -d --build backend
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_PROVIDER: ${RAG_PROVIDER:-mock}
      RAG_BASE_URL: ${RAG_BASE_URL:-https://api.deepseek.com/v1}
      RAG_MODEL: ${RAG_MODEL:-deepseek-chat}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_TIMEOUT_MS: ${RAG_TIMEOUT_MS:-60000}
      RAG_TEMPERATURE: ${RAG_TEMPERATURE:-0.2}
      RAG_MAX_TOKENS: ${RAG_MAX_TOKENS:-1024}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_CONTEXT_MAX_CHARS: ${RAG_CONTEXT_MAX_CHARS:-4000}
      RAG_RATE_LIMIT_PER_MINUTE: ${RAG_RATE_LIMIT_PER_MINUTE:-5}
      RAG_DAILY_LIMIT: ${RAG_DAILY_LIMIT:-100}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      # 上传文件与后端共享同一个 named volume（后端写入 /app/uploads）。
      # 早先这里挂的是宿主机的 ./blog-backend/uploads，与后端实际写入的卷不是同一份，
      # 导致新上传的文件经 nginx 访问 404。
      - backend_uploads:/usr/share/nginx/html/uploads
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
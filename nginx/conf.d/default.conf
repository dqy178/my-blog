server {
    listen 80;
    server_name localhost;
    index index.html;

    # 静态资源与 SPA 路由统一交给 frontend 容器处理。
    #
    # 为什么不在这里直接挂宿主机目录：dist 会被构建进 frontend 镜像，
    # 若 nginx 另挂一份宿主机的 dist，就会出现「两份 dist」——
    # 重建镜像后 nginx 仍服务旧文件，前端改动看起来不生效。
    # 单一来源（frontend 镜像）可彻底避免这种不同步。
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 代理到后端（不带尾斜杠，保留 /api 前缀，与后端 server.servlet.context-path=/api 对齐）
    location /api/ {
        proxy_pass http://blog-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 这里不加安全头：后端的 Spring Security 默认就会带上
        # X-Frame-Options: DENY、X-Content-Type-Options: nosniff、X-XSS-Protection: 0，
        # 且 DENY 比网关层的 SAMEORIGIN 更严格；响应是 JSON，本就不需要防点击劫持。
    }

    # 文件上传访问。
    # alias 指向与后端共享的同一个 named volume（backend_uploads），
    # 保证「后端写入的文件」与「nginx 对外提供的文件」是同一份数据。
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # nginx 的 add_header 会覆盖父级所有的 add_header，
        # 因此这里必须把安全头再写一遍，否则 /uploads/ 的响应会丢掉它们。
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
    }
}

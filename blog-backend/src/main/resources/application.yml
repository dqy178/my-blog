server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: blog-backend
  profiles:
    # 本地默认 dev; 容器 / 生产环境用 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    deserialization:
      # 忽略请求体中的未知字段，避免前端新增字段直接导致 500
      # (曾因前端多带一个已废弃的 imageUrl 字段导致评论提交全部失败)
      fail-on-unknown-properties: false
  data:
    jpa:
      repositories:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/blog_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j2
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
    timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
  # mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.blog.entity

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document: true
    enable-search: true
    enable-footer: false
    enable-debug: true

jwt:
  # JWT 签名密钥。未提供 JWT_SECRET 时启动即失败。
  # 生产（prod）必须用环境变量注入，见根目录 .env.example。
  # 本地开发可在 application-dev.yml 中提供默认值。
  # 至少 32 字节，JJWT 0.12 HS256 强校验；HS512 需 ≥64 字节
  secret: ${JWT_SECRET}
  expiration: 86400000
  header: Authorization
  token-head: Bearer

file:
  upload:
    path: ./uploads/
    domain: http://localhost:8080/api

# 跨域白名单（逗号分隔）。生产环境用 CORS_ALLOWED_ORIGINS 指定实际域名，
# 不要用 * —— 配合 allowCredentials(true) 会回显任意 Origin
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

logging:
  level:
    com.blog: debug
    org.springframework.security: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
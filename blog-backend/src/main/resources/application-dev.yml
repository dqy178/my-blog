spring:
  datasource:
    # 本地开发指向 Docker Compose 里的 MySQL。
    # compose 把容器内 3306 映射到宿主机 3307（宿主机 3306 已被本机 MySQL 5.7 占用），
    # 所以这里必须写 3307。若改用本机 MySQL，把端口改回 3306 即可。
    url: jdbc:mysql://localhost:3307/blog_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

file:
  upload:
    # 相对路径，相对后端运行目录（blog-backend/），避免硬编码某台机器的绝对路径
    path: ${FILE_UPLOAD_PATH:./uploads/}
    domain: ${FILE_UPLOAD_DOMAIN:http://localhost:8080/api}

# ---------------------------------------------------------------------------
# JWT 签名密钥（仅开发环境）
# ---------------------------------------------------------------------------
# 这里给了默认值，开箱即用，不用每次 mvn spring-boot:run 前都设环境变量。
#
# 安全性：默认值只写在 application-dev.yml，而 dev profile 是本地开发专用
# （生产用 SPRING_PROFILES_ACTIVE=prod 走 application-prod.yml，
#  那里没有默认值，JWT_SECRET 缺失会直接启动失败）。
#
# 但仍建议在 .env 里设一个真正的随机值，并让本地也读它：
#   JWT_SECRET=<openssl rand -base64 48 的输出>
#
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32bytes-min}
  expiration: 86400000
  token-head: Bearer
